[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-surface-generative-model"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "pandas",
  "openpyxl",
  "scipy",
  "matplotlib",
  "pytest",
  "requests",
  "feedparser",
  "python-dateutil",
  "nltk",
  "pandas_datareader",
  "scikit-learn",
  "optuna",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: mark integration tests"]
